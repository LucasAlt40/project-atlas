name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository. Third-party actions are pinned by commit
# (Dependabot keeps the pins current), so a moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Known vulnerabilities in the app's npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Known vulnerabilities in the Rust dependencies (RustSec)
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build
      - run: npm run check
      # The OS credential store's real write/read/delete (ADR 0028), by exact name: no model, no
      # network. macOS is verified on a developer machine (a runner's login keychain can prompt).
      - name: Credential store round trip (Windows Credential Manager)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib infrastructure::credential_store::tests::real_keyring_round_trips_and_forgets_a_secret -- --ignored --exact
      - name: Credential store round trip (Linux Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11
          dbus-run-session -- sh -c 'echo atlas-ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null && cargo test --manifest-path src-tauri/Cargo.toml --lib infrastructure::credential_store::tests::real_keyring_round_trips_and_forgets_a_secret -- --ignored --exact'
