<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Celular — Conectar este celular</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              lowest: '#0b0d10',
              base: '#101317',
              muted: '#15191e',
              border: '#1c2128',
              hover: '#242c37'
            },
            accent: {
              DEFAULT: '#6366f1',
              hover: '#4f46e5'
            },
            status: {
              success: '#10b981',
              warning: '#f59e0b',
              error: '#ef4444',
              running: '#60a5fa'
            }
          },
          fontFamily: {
            sans: ['Geist', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0b0d10;
      color: #f3f4f6;
      font-family: 'Geist', sans-serif;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0b0d10] text-[#f3f4f6] flex flex-col justify-between selection:bg-[#6366f1]/30">

  <!-- Container Mobile Restrito a 390px centralizado caso aberto em viewport maior -->
  <div class="w-full max-w-[390px] mx-auto min-h-screen flex flex-col justify-between px-5 pt-0 pb-7 bg-[#0b0d10]">
    
    <!-- Topo e Miolo de Conteúdo -->
    <div class="flex flex-col">
      <!-- Barra de Topo Fixa (48px) -->
      <header class="h-12 flex items-center border-b border-[#1c2128] -mx-5 px-5 mb-7 bg-[#0b0d10]">
        <span class="text-[17px] font-semibold text-[#f3f4f6] tracking-tight">Atlas</span>
      </header>

      <!-- Título Principal -->
      <h1 class="text-[22px] font-semibold text-[#f3f4f6] leading-[1.3] mb-8">
        Acompanhe seus workflows e responda o que está esperando por você.
      </h1>

      <!-- Passos Numerados -->
      <div class="space-y-6 mb-8">
        <!-- Passo 1 -->
        <div class="flex items-start gap-4">
          <span class="font-mono text-2xl font-semibold text-[#6366f1] leading-none shrink-0 w-6 pt-0.5">
            1
          </span>
          <p class="text-[15px] text-[#e5e7eb] leading-relaxed">
            No computador, abra o Atlas e escolha “Celular”.
          </p>
        </div>

        <!-- Passo 2 -->
        <div class="flex items-start gap-4">
          <span class="font-mono text-2xl font-semibold text-[#6366f1] leading-none shrink-0 w-6 pt-0.5">
            2
          </span>
          <p class="text-[15px] text-[#e5e7eb] leading-relaxed">
            Escaneie o QR Code com a câmera deste celular ou digite o código abaixo.
          </p>
        </div>
      </div>

      <!-- Formulário de Código de Pareamento -->
      <div class="space-y-2 mb-4">
        <label for="codigo-pareamento" class="block text-[15px] font-medium text-[#f3f4f6]">
          Código de pareamento
        </label>
        <div class="relative">
          <input
            id="codigo-pareamento"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="ABCD-EFGH-IJKL-MNOP"
            class="w-full h-12 bg-[#101317] border border-[#1c2128] focus:border-[#6366f1] focus:ring-1 focus:ring-[#6366f1] focus:outline-none rounded-lg px-4 font-mono text-[16px] tracking-wider text-[#f3f4f6] placeholder-[#6b7280] transition-colors"
          />
        </div>
      </div>
    </div>

    <!-- Rodapé: Ação do Polegar e Nota Informativa -->
    <div class="space-y-3 pt-6">
      <button 
        type="button"
        class="w-full h-12 bg-[#6366f1] active:bg-[#4f46e5] text-white text-[16px] font-semibold rounded-[12px] flex items-center justify-center transition-colors duration-150"
      >
        Conectar
      </button>

      <p class="text-[13px] text-[#9ca3af] text-center leading-normal px-2">
        O código vale uma vez e expira em minutos. Nada sai da sua rede.
      </p>
    </div>

  </div>

</body>
</html>
