<main class="w-[390px] h-[844px] max-w-[390px] max-h-[844px] bg-background flex flex-col relative overflow-hidden border border-outline-variant/30 shadow-none">

<button aria-label="Voltar" class="flex items-center gap-1.5 h-11 min-h-[44px] px-1 text-on-surface hover:text-primary transition-colors active:opacity-70 focus:outline-none" type="button">

<div class="flex items-center h-11 min-h-[44px] px-1">
<span class="font-code-sm text-code-sm text-outline tracking-tight">iPhone do Lucas</span>
</div>

<div class="flex-1 overflow-y-auto px-4 py-4 space-y-3.5">

<div class="flex items-center justify-between gap-2">
<h1 class="font-headline-lg text-headline-sm font-semibold text-on-surface tracking-tight truncate">
            Recuperação de senha
          </h1>
<!-- Selo de estado: Esperando você -->
<div class="flex items-center gap-1.5 px-2 py-0.5 rounded-[4px] bg-[#f59e0b]/15 border border-[#f59e0b]/30 shrink-0">
<span class="w-1.5 h-1.5 rounded-full bg-[#f59e0b] animate-pulse"></span>
<span class="font-label-md text-label-md text-[#f59e0b] font-medium leading-none">Esperando você</span>
</div>
</div>
<!-- Metadados técnicos -->
<p class="font-code-sm text-code-sm text-outline flex items-center gap-1">
<span>Transport ERP</span>
<span class="text-outline-variant">·</span>
<span>iniciada 22:10</span>
<span class="text-outline-variant">·</span>
<span>14m 06s</span>
</p>
</section>
<!-- AVISO REDUZIDO DA PERGUNTA -->
<section>
<button class="w-full min-h-[44px] bg-[#f59e0b]/10 border border-[#f59e0b]/30 rounded-lg px-3 py-2.5 flex items-center justify-between text-left transition-colors active:bg-[#f59e0b]/15 focus:outline-none" type="button">

</div>

</button>

<span class="material-symbols-outlined text-[20px] text-outline">expand_less</span>
</button>
<!-- Conteúdo Interno da Seção Aberta -->
<div class="px-3.5 pb-4 pt-1 border-t border-outline-variant/40">

<div class="relative pl-7 space-y-5 before:content-[''] before:absolute before:left-[11px] before:top-2 before:bottom-3 before:w-[1px] before:bg-outline-variant">

<div class="relative group">
<!-- Marcador de nó -->
<div class="absolute -left-7 top-0.5 w-[23px] h-[23px] rounded-full bg-surface-container-low border border-[#10b981]/40 flex items-center justify-center z-10">
<span class="font-label-sm text-[#10b981] font-bold text-[12px] leading-none">✓</span>
</div>

<div class="flex items-center justify-between gap-2">
<span class="font-body-md text-body-md font-medium text-on-surface">Architect</span>

</div>
<p class="font-code-sm text-code-sm text-outline">Arch agent · 30s</p>
<!-- Item recolhível discreto -->
<button class="min-h-[44px] pt-1 flex items-center gap-1 text-outline hover:text-on-surface transition-colors focus:outline-none active:opacity-70" type="button">
<span class="font-body-sm text-body-sm text-outline">O que ela relatou</span>
<span class="material-symbols-outlined text-[16px]">expand_more</span>
</button>
</div>
</div>
<!-- Etapa 2: Developer (Esperando você) -->
<div class="relative group">
<!-- Marcador de nó -->
<div class="absolute -left-7 top-0.5 w-[23px] h-[23px] rounded-full bg-surface-container-low border border-[#f59e0b] flex items-center justify-center z-10">
<span class="font-label-sm text-[#f59e0b] font-bold text-[13px] leading-none">?</span>
</div>
<div class="space-y-1">
<div class="flex items-center justify-between gap-2">
<span class="font-body-md text-body-md font-medium text-on-surface">Developer</span>

</div>
<div class="flex items-center gap-2 font-code-sm text-code-sm">

<span class="text-on-surface-variant font-body-sm text-body-sm">Depois: QA</span>
</div>
</div>

<div class="absolute -left-7 top-0.5 w-[23px] h-[23px] rounded-full bg-surface-container-low border border-outline-variant flex items-center justify-center z-10">
<span class="w-2 h-2 rounded-full border border-outline/60"></span>
</div>
<div class="space-y-0.5">
<div class="flex items-center justify-between gap-2">
<span class="font-body-md text-body-md font-medium text-outline">QA</span>
<span class="font-label-sm text-label-sm text-outline bg-surface-container-high px-1.5 py-0.5 rounded-[4px] border border-outline-variant">Não iniciada</span>
</div>
<p class="font-code-sm text-code-sm text-outline/70">QA agent</p>
</div>
</div>
</div>
</div>

<section class="bg-surface-container-low border border-outline-variant rounded-xl overflow-hidden">
<button class="w-full min-h-[44px] px-3.5 py-3 flex items-center justify-between bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high transition-colors focus:outline-none" type="button">

<span class="material-symbols-outlined text-[20px] text-outline">expand_more</span>

<section class="bg-surface-container-low border border-outline-variant rounded-xl overflow-hidden">
<button class="w-full min-h-[44px] px-3.5 py-3 flex items-center justify-between bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high transition-colors focus:outline-none" type="button">
