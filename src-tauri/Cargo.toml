[package]
name = "atlas"
version = "0.1.1"
description = "Project Atlas - AI-powered development orchestration"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"
repository = "https://github.com/LucasAlt40/project-atlas"

[lib]
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
serde_norway = "0.9.42"
tauri-plugin-notification = "2"
notify = "8"
# Already in the tree through Tauri (same version in Cargo.lock): the prompt hash of the Context
# Manifest must be a real SHA-256, not the FNV-1a the Harness uses for change detection.
sha2 = "0.10"
# The OS credential store (macOS Keychain, Windows Credential Manager, Linux Secret Service) for MCP
# secrets. Used only by `infrastructure/`, behind the `CredentialStore` port.
keyring = "4"

[target.'cfg(unix)'.dependencies]
# Same crate (and version) `portable-pty` already uses; the `signal` feature adds the safe
# `killpg`, so stopping a process group needs no `unsafe` here.
nix = { version = "0.28", features = ["signal"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
