[package]
name = "atlas"
version = "0.4.0"
description = "Project Atlas - AI-powered development orchestration"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"
repository = "https://github.com/LucasAlt40/project-atlas"

[lib]
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1.0.5"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
serde_norway = "0.9.42"
tauri-plugin-notification = "2"
notify = "8"
# Already in the tree through Tauri (same version in Cargo.lock): the prompt hash of the Context
# Manifest must be a real SHA-256, not the FNV-1a the Harness uses for change detection.
sha2 = "0.10"
# The OS credential store (macOS Keychain, Windows Credential Manager, Linux Secret Service) for MCP
# secrets. Used only by `infrastructure/`, behind the `CredentialStore` port.
keyring = "4"
tauri-plugin-updater = "2"
# Mobile access (ADR 0034). hyper, Tokio and their helpers are already in the tree through Tauri; only
# the features the local server needs are switched on. `if-addrs` lists the network interfaces,
# `qrcode` draws the pairing QR as SVG (no image stack), `getrandom` is the OS CSPRNG.
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.3"
# Warnings the core used to print to a stderr nobody sees in an installed app now land in a
# rotating file in the OS log folder (`~/Library/Logs/<identifier>/` on macOS). Rust-side only:
# the webview gets no logging permission.
log = "0.4"
tauri-plugin-log = "2"

[target.'cfg(unix)'.dependencies]
# Same crate (and version) `portable-pty` already uses; the `signal` feature adds the safe
# `killpg`, so stopping a process group needs no `unsafe` here.
nix = { version = "0.28", features = ["signal"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# The end-to-end tests of mobile access talk to the real server over a socket.
tokio = { version = "1", features = ["io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
